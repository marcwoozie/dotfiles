# ============================================
# プレフィックスキー設定
# ============================================
# プレフィックスキーをctrl+gに変更
set -g prefix C-g

# デフォルトのプレフィックスキーctrl+bを解除
unbind C-b

# ============================================
# ペイン分割設定
# ============================================
# プレフィックスキー+ | でペインを垂直分割する
bind | split-window -h

# プレフィックスキー+ - でペインを水平分割する
bind - split-window -v

# 現在のパスを引き継いでペインを分割する
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================
# 色・表示設定
# ============================================
# 256色モードを有効化
set-option -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ペイン枠線の見た目（アクティブ pane を強調）
set -g pane-border-style fg=#565f89
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#1a1b26,bg=#7dcfff,bold] ACTIVE #[default],#[fg=#565f89] pane } #[fg=#7aa2f7]#P #[fg=#73daca]#{pane_current_command}"

# ============================================
# ステータスバー設定
# ============================================
# ステータスバーを画面上部に表示
# set -g status-position top

# ステータスバーの更新間隔を1秒
set -g status-interval 1

# ============================================
# マウス・操作設定
# ============================================
# マウス操作を有効化
set-option -g mouse on

# コピーモードの操作をVimバインドにする
set-window-option -g mode-keys vi
bind v copy-mode

# コピーモード内のキーバインド
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================
# その他設定
# ============================================
# ~/.tmux.conf	設定ファイルの反映を楽にする
bind r source-file ~/.tmux.conf

# スクロールバックの行数を増やす
set -g history-limit 50000

# プレフィックスキー+gでポップアップを表示
bind g display-popup -d "#{pane_current_path}" -w 60% -h 60% -E "$SHELL"

# fzh上でgit branchを選択できるように 
bind-key b run-shell "cd #{pane_current_path} && git branch --format='%(refname:short)' | fzf-tmux -p -w 60% -h 40% --reverse | xargs echo -n | pbcopy && tmux display-message 'Branch copied!'"

# ============================================
# プラグイン関連
# ============================================
# macOS向けロケール修正（run-shell実行時の C.UTF-8 警告を回避）
set-environment -gu LC_ALL
set-environment -gu LC_CTYPE
set-environment -g LANG "en_US.UTF-8"

# Homebrewバイナリを優先しつつ、tmux run-shell 用にシステムPATHも保持
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

set -g @plugin 'catppuccin/tmux#v2.1.3'

# TPMの有効化
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-pain-control' # ペインのサイズ変更を簡単にする
set -g @plugin 'tmux-plugins/tmux-battery' # バッテリー残量をステータスバーに表示する
set -g @plugin 'tmux-plugins/tmux-yank' # クリップボードとの連携
set -g @plugin 'sainnhe/tmux-fzf' # Fuzzy Search

# ============================================
# catppuccin/tmux#v2.1.3の設定
# ============================================
# Options to make tmux more pleasant
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Make the status line pretty and add some modules
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

set -g status-right-length 150
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M:%S"

set -agF status-right "#{E:@catppuccin_status_battery}"

# Load TPM Plugins
run '~/.tmux/plugins/tpm/tpm'
