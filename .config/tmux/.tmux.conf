# ============================================
# プレフィックスキー設定
# ============================================
# プレフィックスキーをctrl+gに変更
set -g prefix C-g

# デフォルトのプレフィックスキーctrl+bを解除
unbind C-b

# ============================================
# ペイン分割設定
# ============================================
# プレフィックスキー+ | でペインを垂直分割する
bind | split-window -h

# プレフィックスキー+ - でペインを水平分割する
bind - split-window -v

# 現在のパスを引き継いでペインを分割する
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================
# 色・表示設定
# ============================================
# 256色モードを有効化
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# ステータスラインの文字色、背景色を変更
setw -g status-style fg=colour255,bg="#d0f429"

# ステータスバーの色
set -g status-fg white
set -g status-bg black

# ============================================
# ステータスバー設定
# ============================================
# 左側の表示（セッション名）
set -g status-left-length 100
set -g status-left "#[fg=green]Session: #S Pane: #P #{?client_prefix,#[bg=yellow fg=black] PREFIX ,}"

# 右側の表示（時刻）
set -g status-right "#[fg=gray]%Y-%m-%d #[fg=gray]%H:%M:#[fg=gray]%S"

# ステータスバーの更新間隔を1秒
set -g status-interval 1

# ============================================
# マウス・操作設定
# ============================================
# マウス操作を有効化
set-option -g mouse on

# コピーモードの操作をVimバインドにする
set-window-option -g mode-keys vi
bind v copy-mode

# ============================================
# その他設定
# ============================================
# ~/.tmux.conf	設定ファイルの反映を楽にする
bind r source-file ~/.tmux.conf

# スクロールバックの行数を増やす
set -g history-limit 50000

# プレフィックスキー+gでポップアップを表示
bind g display-popup -d "#{pane_current_path}" -w 60% -h 60% -E "$SHELL"
