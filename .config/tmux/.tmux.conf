# ============================================
# プレフィックスキー設定
# ============================================
# プレフィックスキーをctrl+gに変更
set -g prefix C-g

# デフォルトのプレフィックスキーctrl+bを解除
unbind C-b

# ============================================
# ペイン分割設定
# ============================================
# プレフィックスキー+ | でペインを垂直分割する
bind | split-window -h

# プレフィックスキー+ - でペインを水平分割する
bind - split-window -v

# 現在のパスを引き継いでペインを分割する
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================
# 色・表示設定
# ============================================
# 256色モードを有効化
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# ステータスラインの文字色、背景色を変更
setw -g status-style fg=colour255,bg="#d0f429"

# ステータスバーの色
set -g status-fg white
set -g status-bg black

# ペイン枠線の見た目（アクティブ pane を強調）
set -g pane-border-style fg=#565f89
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#1a1b26,bg=#7dcfff,bold] ACTIVE #[default],#[fg=#565f89] pane } #[fg=#7aa2f7]#P #[fg=#73daca]#{pane_current_command}"

# ============================================
# ステータスバー設定
# ============================================
# 左側の表示（セッション名）
set -g status-left-length 100
set -g status-left "#[fg=green]Session: #S Pane: #P #{?client_prefix,#[bg=yellow fg=black] PREFIX ,}"

# 右側の表示（時刻）
set -g status-right "#[fg=gray]%Y-%m-%d #[fg=gray]%H:%M:#[fg=gray]%S"

# ステータスバーの更新間隔を1秒
set -g status-interval 1

# ============================================
# マウス・操作設定
# ============================================
# マウス操作を有効化
set-option -g mouse on

# コピーモードの操作をVimバインドにする
set-window-option -g mode-keys vi
bind v copy-mode

# ============================================
# その他設定
# ============================================
# ~/.tmux.conf	設定ファイルの反映を楽にする
bind r source-file ~/.tmux.conf

# スクロールバックの行数を増やす
set -g history-limit 50000

# プレフィックスキー+gでポップアップを表示
bind g display-popup -d "#{pane_current_path}" -w 60% -h 60% -E "$SHELL"

# ============================================
# プラグイン関連
# ============================================
# macOS向けロケール修正（run-shell実行時の C.UTF-8 警告を回避）
set-environment -gu LC_ALL
set-environment -gu LC_CTYPE
set-environment -g LANG "en_US.UTF-8"

# Homebrewバイナリを優先しつつ、tmux run-shell 用にシステムPATHも保持
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# TPMの有効化
set -g @plugin 'tmux-plugins/tpm'

# PowerKit plugin
set -g @plugin 'fabioluciano/tmux-powerkit'

# PowerKitの設定
set -g @powerkit_bar_layout "single"
set -g @powerkit_plugins "datetime,battery,cpu,git,hostname"
set -g @powerkit_plugin_datetime_format "time-seconds"
set -g @powerkit_theme "solarized"
set -g @powerkit_theme_variant "dark"
set -g @powerkit_plugin_timezones_zones "local"
set -g @powerkit_status_position "bottom"
set -g @powerkit_status_interval "1"

# TPMとPowerKitを利用可能な場合のみ初期化（末尾に配置）
run-shell 'if [ -x "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm" >/dev/null 2>&1; fi'
run-shell 'if [ -x "$HOME/.tmux/plugins/tmux-powerkit/tmux-powerkit.tmux" ] && command -v bash >/dev/null 2>&1 && [ "$(bash -lc "echo ${BASH_VERSINFO[0]}")" -ge 5 ]; then "$HOME/.tmux/plugins/tmux-powerkit/tmux-powerkit.tmux" >/dev/null 2>&1; fi'
